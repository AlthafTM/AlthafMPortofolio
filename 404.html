<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Not Found | Althaf M.</title>
    <meta name="theme-color" content="#0b0b0d" />

    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <style data-tag="reset-style-sheet">
      html {  line-height: 1.15;}body {  margin: 0;}* {  box-sizing: border-box;  border-width: 0;  border-style: solid;  -webkit-font-smoothing: antialiased;}p,li,ul,pre,div,h1,h2,h3,h4,h5,h6,figure,blockquote,figcaption {  margin: 0;  padding: 0;}a {  color: inherit;  text-decoration: inherit;}img {  display: block;  max-width: 100%;}html {  scroll-behavior: smooth;}
    </style>

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./404.css" />
  </head>
  <body class="error-page">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <div class="language-slot language-slot--float"></div>
    <button
      class="theme-toggle theme-toggle--float"
      type="button"
      aria-label="Toggle light and dark mode"
      title="Toggle theme"
    >
      <span class="theme-toggle__icon" aria-hidden="true">
              <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg>
              <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></g></svg>
            </span>
    </button>
    <div class="not-found-container1">
      <h3 class="not-found-kicker">Oops! Page not found</h3>
      <div class="not-found-container2">
        <h1 class="not-found-text2">404</h1>
      </div>
      <div class="not-found-container3">
        <h2 class="not-found-text3">
          We are sorry, but the page you requested was not found.
        </h2>
        <a class="not-found-link" href="./index.html">Back to home</a>
      </div>
    </div>
    <script src="./data/translations.js"></script>
    <script src="./assets/language.js"></script>
    <script src="./assets/theme.js" defer></script>
  </body>
</html>
